name: Brasaland sales forecast tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/regression-model-eval

jobs:
  temporal-cv:
    name: Chronological fold unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.9"
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Temporal cross-validation keeps chronological order
        run: uv run python -m pytest tests/pipelines/test_temporal_cv.py -q
