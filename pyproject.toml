[project]
name = "ai-engineering-company-project-monorepo"
version = "0.1.0"
description = "Brasaland AI Engineering company monorepo"
requires-python = ">=3.9"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.128.8",
    "flower>=2.0.1",
    "httpx>=0.28.1",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "redis>=7.0.1",
    "sqlmodel>=0.0.34",
    "psycopg2-binary>=2.9.12",
    "tinydb>=4.8.2",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
]
