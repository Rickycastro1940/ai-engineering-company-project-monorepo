# Local stack for Brasaland Digital (Technology API, Marketing website,
# Operations/Executive backoffice, Redis + Celery weekly pipeline).
# Requires a root .env (see .env.example). Create .env before starting Compose.

x-redis-url: &redis_url redis://redis:6379/0

services:
  redis:
    image: redis:7
    container_name: brasaland-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-api
    env_file:
      - .env
    environment:
      REDIS_URL: *redis_url
      CELERY_BROKER_URL: *redis_url
      CELERY_RESULT_BACKEND: *redis_url
    ports:
      - "8000:8000"
    volumes:
      - ./products.csv:/app/products.csv
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  website:
    build:
      context: ./uis
      dockerfile: Dockerfile
      args:
        APP_DIR: website
    container_name: brasaland-website
    env_file:
      - .env
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backoffice:
    build:
      context: ./uis
      dockerfile: Dockerfile
      args:
        APP_DIR: backoffice
    container_name: brasaland-backoffice
    env_file:
      - .env
    environment:
      VITE_API_PROXY: http://api:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports:
      - "5174:5174"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    container_name: brasaland-flower
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      REDIS_URL: *redis_url
      FLOWER_UNAUTHENTICATED_API: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-celery-worker
    command: ["celery", "-A", "services.celery_app", "worker", "--loglevel=info", "-E"]
    env_file:
      - .env
    environment:
      REDIS_URL: *redis_url
      CELERY_BROKER_URL: *redis_url
      CELERY_RESULT_BACKEND: *redis_url
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
