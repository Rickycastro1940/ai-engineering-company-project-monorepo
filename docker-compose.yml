# Brasaland Digital — UI (Camila public site + staff backoffice) and backend API.
# From the repository root, with no extra copy/config step:
#   docker compose up
#
# Committed defaults are `.env.example` (no secrets). Optional gitignored `.env`
# overrides those values (JWT_SECRET_KEY, GROQ_API_KEY). Do not hardcode secrets
# or service URLs in this YAML.
#
# Inter-service URLs use the Compose service name as host (`http://backend:8000`),
# never localhost and never a hard-coded IP. The named network uses ICC so Docker
# DNS resolves `backend` / `ui` to container addresses.
#
#   Website:    http://localhost:3000/
#   Backoffice: http://localhost:3001/login
#   API:        http://localhost:8000/docs

networks:
  brasaland:
    name: brasaland-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"

services:
  ui:
    build:
      context: ./uis
      dockerfile: Dockerfile
    image: brasaland-uis
    container_name: brasaland-ui
    working_dir: /uis
    networks:
      - brasaland
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      - backend
    command: ["./start.sh"]
    volumes:
      - ./uis/website:/uis/website
      - ./uis/backoffice:/uis/backoffice
      - ui_website_node_modules:/uis/website/node_modules
      - ui_backoffice_node_modules:/uis/backoffice/node_modules
    ports:
      - "3000:3000"
      - "3001:3001"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    image: brasaland-api
    container_name: brasaland-backend
    networks:
      - brasaland
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    volumes:
      - ./api:/app/api
      - ./services:/app/services
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./agent.py:/app/agent.py
      - ./products.csv:/app/products.csv
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ui_website_node_modules:
  ui_backoffice_node_modules:
