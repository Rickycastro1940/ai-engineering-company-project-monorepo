# Brasaland Digital — UI (Camila public site + staff backoffice) and backend API.
# Two services on an explicit network. Inter-service URLs use the Compose
# service name as host (http://backend:8000), never localhost.
#
# Secrets (GROQ_API_KEY, JWT_SECRET_KEY, passwords) belong only in root .env
# (gitignored). Never put real keys in this file or any Dockerfile.
#   cp .env.example .env
#
#   docker compose up --build
#   Website:    http://localhost:3000/
#   Backoffice: http://localhost:3001/login
#   API:        http://localhost:8000/docs
#
# Redis/Flower/Celery worker: see services/README.md (not part of this file).

networks:
  brasaland:
    name: brasaland-net
    driver: bridge

services:
  ui:
    build:
      context: ./uis
      dockerfile: Dockerfile
    image: brasaland-uis
    container_name: brasaland-ui
    networks:
      - brasaland
    extra_hosts:
      # Named host "backend" (not localhost). On this VM the Docker bridge
      # does not pass container-to-container TCP, so resolve the service name
      # to the host gateway and use the published backend port 8000.
      - "backend:host-gateway"
    env_file:
      - path: .env
        required: false
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      # Next.js rewrites in the ui container talk to the backend service by name.
      API_PROXY: http://backend:8000
      VITE_API_PROXY: http://backend:8000
    command:
      - /bin/sh
      - -c
      - |
        cd /uis/website && npm run dev -- --hostname 0.0.0.0 --port 3000 &
        cd /uis/backoffice && npm run dev -- --hostname 0.0.0.0 --port 3001 &
        wait
    volumes:
      - ./uis/website:/uis/website
      - ./uis/backoffice:/uis/backoffice
      - ui_website_node_modules:/uis/website/node_modules
      - ui_backoffice_node_modules:/uis/backoffice/node_modules
    ports:
      - "3000:3000"
      - "3001:3001"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    image: brasaland-api
    container_name: brasaland-backend
    networks:
      - brasaland
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app
    volumes:
      - ./api:/app/api
      - ./services:/app/services
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./agent.py:/app/agent.py
      - ./products.csv:/app/products.csv
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ui_website_node_modules:
  ui_backoffice_node_modules:
